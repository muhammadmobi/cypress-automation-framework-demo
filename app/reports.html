<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopWise — Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header data-test="app-header"></header>
    <main>
      <h2>Category Stock Report</h2>
      <table class="table" data-test="reports-table">

          <tr>
            <th>Category</th>
            <th>Products</th>
            <th>Total stock</th>
            <th>Stock value</th>
          </tr>
        </thead>
        <tbody data-test="reports-body"></tbody>
      </table>
    </main>
    <script src="app.js"></script>
  </body>
</html>
