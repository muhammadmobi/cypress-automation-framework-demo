<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopWise — Checkout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header data-test="app-header"></header>
    <main>
      <form class="login-card" data-test="checkout-form" novalidate>
        <h1 style="font-size: 22px">Checkout</h1>
        <label for="first">First Name</label>
        <input id="first" data-test="first-name" type="text" />
        <label for="last">Last Name</label>
        <input id="last" data-test="last-name" type="text" />
        <label for="zip">Postal Code</label>
        <input id="zip" data-test="postal-code" type="text" />
        <button class="btn" type="submit" data-test="finish">Finish</button>
        <div class="error" data-test="checkout-error" role="alert"></div>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
