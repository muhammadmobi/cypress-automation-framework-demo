<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopWise — Inventory</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header data-test="app-header"></header>
    <main>
      <div class="toolbar">
        <h2>Products</h2>
        <select data-test="sort" aria-label="Sort products">
          <option value="az">Name (A → Z)</option>
          <option value="za">Name (Z → A)</option>
          <option value="lohi">Price (low → high)</option>
          <option value="hilo">Price (high → low)</option>
        </select>
      </div>
      <div class="grid" data-test="inventory-grid"></div>
    </main>
    <script src="app.js"></script>
    <script src="chatbot.js"></script>
  </body>
</html>
